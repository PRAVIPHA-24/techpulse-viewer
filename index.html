<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TECHPULSE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <div class="brand">TECHPULSE</div>
            <div class="tagline">
                Autonomous Technology Learning Agent
            </div>
        </header>

        <section class="hero">
            <p class="label">LATEST EDITION</p>

            <h1 id="technology">
                Loading...
            </h1>

            <p id="generated">
                Discovering the latest technology edition
            </p>
        </section>

        <article id="content">

            <div class="loading">
                TECHPULSE is loading today's edition...
            </div>

        </article>

        <footer>
            <p>
                Automatically generated by TECHPULSE
            </p>

            <p id="status">
                Connecting...
            </p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
